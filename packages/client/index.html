<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Openfront Clone</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #05080f;
      color: #c8d8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-variant-numeric: tabular-nums;
    }

    /* ── Canvas layer ── */
    #game-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Vignette overlay ── */
    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center,
        transparent 60%,
        rgba(0, 0, 0, 0.45) 100%);
      z-index: 1;
    }

    /* ── UI overlay ── */
    #ui-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* ── Panel base ── */
    .panel {
      background: rgba(5, 12, 28, 0.92);
      border: 1px solid rgba(40, 90, 200, 0.25);
      border-radius: 8px;
      padding: 12px 16px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* ════════════════════════════
       Player HUD — top left
    ════════════════════════════ */
    #player-hud {
      position: absolute;
      top: 14px;
      left: 14px;
      min-width: 210px;
      pointer-events: none;
    }

    #player-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #4488ff;
      margin-bottom: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      margin-bottom: 3px;
      color: #5070a0;
    }

    .stat-label {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stat-label .icon {
      font-size: 12px;
      line-height: 1;
    }

    .stat-value {
      color: #c8d8f0;
      font-weight: 600;
      font-size: 12px;
    }

    .stat-bar-wrap {
      height: 2px;
      background: rgba(40, 90, 200, 0.15);
      border-radius: 1px;
      margin-bottom: 7px;
      overflow: hidden;
    }

    .stat-bar {
      height: 100%;
      border-radius: 1px;
      width: 50%;
      transition: width 0.4s ease;
    }

    #stat-troops-bar { background: #4488ff; }
    #stat-pop-bar    { background: #33ee77; }

    /* ════════════════════════════
       Leaderboard — top right
    ════════════════════════════ */
    #leaderboard {
      position: absolute;
      top: 14px;
      right: 14px;
      min-width: 200px;
      pointer-events: none;
    }

    #leaderboard h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #5070a0;
      margin-bottom: 10px;
    }

    .lb-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      margin-bottom: 5px;
      padding: 2px 0;
      overflow: hidden;
    }

    .lb-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      background: rgba(40, 90, 200, 0.1);
      border-radius: 2px;
      transition: width 0.5s ease;
      z-index: 0;
    }

    .lb-rank {
      font-size: 12px;
      min-width: 20px;
      text-align: center;
      z-index: 1;
    }

    .lb-color {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
      z-index: 1;
    }

    .lb-name {
      flex: 1;
      color: #c8d8f0;
      font-size: 11px;
      z-index: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lb-tiles {
      color: #4488ff;
      font-weight: 600;
      font-size: 11px;
      z-index: 1;
    }

    /* ════════════════════════════
       Bottom controls
    ════════════════════════════ */
    #conquest-controls {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: all;
    }

    #conquest-controls-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5070a0;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #troop-slider {
      width: 180px;
      accent-color: #33ee77;
      cursor: pointer;
    }

    #troop-pct-label {
      font-size: 18px;
      font-weight: 700;
      color: #33ee77;
      min-width: 48px;
      text-align: left;
    }

    /* ════════════════════════════
       Attack indicator — bottom left
    ════════════════════════════ */
    #attack-indicator {
      position: absolute;
      bottom: 22px;
      left: 14px;
      background: rgba(255, 80, 0, 0.12);
      border: 1px solid #ff6600;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 12px;
      color: #ffaa33;
      font-weight: 600;
      display: none;
      animation: pulse-border 1.2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse-border {
      0%, 100% { border-color: #ff6600; box-shadow: 0 0 5px rgba(255, 102, 0, 0.4); }
      50%       { border-color: #ffaa44; box-shadow: 0 0 12px rgba(255, 153, 0, 0.6); }
    }

    /* ════════════════════════════
       Status messages
    ════════════════════════════ */
    #status-msg {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12.5px;
      color: #ff8855;
      background: rgba(5, 12, 28, 0.88);
      border: 1px solid rgba(255, 100, 40, 0.3);
      padding: 5px 14px;
      border-radius: 5px;
      display: none;
      pointer-events: none;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }

    /* ════════════════════════════
       Tile tooltip
    ════════════════════════════ */
    #tile-tooltip {
      position: absolute;
      background: rgba(5, 12, 28, 0.94);
      border: 1px solid rgba(40, 90, 200, 0.3);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 11px;
      color: #c8d8f0;
      pointer-events: none;
      display: none;
      line-height: 1.7;
      z-index: 50;
      backdrop-filter: blur(4px);
    }

    /* ════════════════════════════
       Connecting overlay
    ════════════════════════════ */
    #connecting-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 15, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      z-index: 100;
    }

    .logo-text {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4488ff;
      text-shadow: 0 0 24px rgba(68, 136, 255, 0.5);
    }

    .connect-sub {
      font-size: 13px;
      color: #5070a0;
      letter-spacing: 0.04em;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(40, 90, 200, 0.2);
      border-top-color: #4488ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ════════════════════════════
       Game over overlay
    ════════════════════════════ */
    #gameover-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 15, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 100;
    }

    #gameover-title {
      font-size: 36px;
      font-weight: 900;
      color: #ffaa33;
      letter-spacing: 0.08em;
      text-shadow: 0 0 20px rgba(255, 170, 51, 0.5);
    }

    #gameover-msg {
      font-size: 15px;
      color: #c8d8f0;
    }

    #gameover-overlay button {
      margin-top: 8px;
      padding: 11px 32px;
      background: #2255bb;
      color: #e8f0ff;
      border: 1px solid rgba(68, 136, 255, 0.5);
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.04em;
      pointer-events: all;
      transition: background 0.2s, box-shadow 0.2s;
    }

    #gameover-overlay button:hover {
      background: #3366cc;
      box-shadow: 0 0 12px rgba(68, 136, 255, 0.4);
    }
  </style>
</head>
<body>
  <!-- Canvas layer (PixiJS appends canvas here) -->
  <div id="game-canvas"></div>

  <!-- Subtle vignette -->
  <div id="vignette"></div>

  <!-- UI layer -->
  <div id="ui-overlay">

    <!-- Player HUD — top left -->
    <div id="player-hud" class="panel">
      <div id="player-name">Bağlanılıyor...</div>

      <div class="stat-row">
        <span class="stat-label"><span class="icon">🗡</span> Asker</span>
        <span class="stat-value" id="stat-troops">0</span>
      </div>
      <div class="stat-bar-wrap">
        <div class="stat-bar" id="stat-troops-bar"></div>
      </div>

      <div class="stat-row">
        <span class="stat-label"><span class="icon">⚒</span> İşçi</span>
        <span class="stat-value" id="stat-workers">0</span>
      </div>

      <div class="stat-row">
        <span class="stat-label"><span class="icon">👥</span> Nüfus</span>
        <span class="stat-value" id="stat-pop">0</span>
      </div>
      <div class="stat-bar-wrap">
        <div class="stat-bar" id="stat-pop-bar"></div>
      </div>

      <div class="stat-row">
        <span class="stat-label"><span class="icon">💰</span> Altın</span>
        <span class="stat-value" id="stat-gold">0</span>
      </div>

      <div class="stat-row">
        <span class="stat-label"><span class="icon">🏴</span> Toprak</span>
        <span class="stat-value" id="stat-tiles">0 kare</span>
      </div>
    </div>

    <!-- Leaderboard — top right -->
    <div id="leaderboard" class="panel">
      <h3>Sıralama</h3>
      <div id="lb-list"></div>
    </div>

    <!-- Conquest controls — bottom center -->
    <div id="conquest-controls" class="panel">
      <div id="conquest-controls-label">⚔ Saldırı Gücü</div>
      <div class="slider-row">
        <input type="range" id="troop-slider" min="10" max="100" step="5" value="50" />
        <span id="troop-pct-label">50%</span>
      </div>
    </div>

    <!-- Attack indicator — bottom left -->
    <div id="attack-indicator"></div>

    <!-- Status message -->
    <div id="status-msg"></div>

    <!-- Tile tooltip -->
    <div id="tile-tooltip"></div>

    <!-- Connecting overlay -->
    <div id="connecting-overlay">
      <div class="logo-text">OPENFRONT</div>
      <div class="spinner"></div>
      <p class="connect-sub">Sunucuya bağlanılıyor...</p>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-overlay">
      <h2 id="gameover-title">Game Over</h2>
      <p id="gameover-msg"></p>
      <button onclick="location.reload()">Tekrar Oyna</button>
    </div>

  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
