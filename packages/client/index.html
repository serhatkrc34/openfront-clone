<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Openfront Clone</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #05080f;
      color: #c8d8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-variant-numeric: tabular-nums;
    }

    /* ── Canvas layer ── */
    #game-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── Vignette overlay ── */
    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center,
        transparent 60%,
        rgba(0, 0, 0, 0.45) 100%);
      z-index: 1;
    }

    /* ── UI overlay ── */
    #ui-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    /* ── Panel base ── */
    .panel {
      background: rgba(5, 12, 28, 0.92);
      border: 1px solid rgba(40, 90, 200, 0.25);
      border-radius: 8px;
      padding: 12px 16px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* ════════════════════════════
       Player HUD — top left
    ════════════════════════════ */
    #player-hud {
      position: absolute;
      top: 14px;
      left: 14px;
      min-width: 180px;
      pointer-events: none;
    }

    #player-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      color: #4488ff;
      margin-bottom: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 12px rgba(68,136,255,0.4);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      margin-bottom: 4px;
      color: #4060a0;
    }

    .stat-label {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stat-label .icon { font-size: 11px; }

    .stat-value {
      color: #c8d8f0;
      font-weight: 700;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* ════════════════════════════
       Leaderboard — top right
    ════════════════════════════ */
    #leaderboard {
      position: absolute;
      top: 14px;
      right: 14px;
      min-width: 280px;
      pointer-events: none;
    }

    .lb-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .lb-header h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #5070a0;
      margin: 0;
    }

    #game-timer {
      font-size: 13px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: #c8d8f0;
      letter-spacing: 0.05em;
    }

    .lb-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .lb-table thead th {
      color: #3a5278;
      font-weight: 600;
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0 4px 5px;
      text-align: right;
      white-space: nowrap;
    }

    .lb-table thead th:nth-child(1) { width: 18px; text-align: center; }
    .lb-table thead th:nth-child(2) { text-align: left; }

    .lb-table tbody tr {
      border-top: 1px solid rgba(40, 90, 200, 0.08);
    }

    .lb-table tbody tr.lb-me td {
      background: rgba(68, 136, 255, 0.08);
    }

    .lb-table tbody td {
      padding: 3px 4px;
      color: #c8d8f0;
      text-align: right;
      white-space: nowrap;
    }

    .lb-table tbody td:nth-child(1) { text-align: center; color: #3a5278; font-size: 10px; }
    .lb-table tbody td:nth-child(2) { text-align: left; }

    .lb-player-cell {
      display: flex;
      align-items: center;
      gap: 5px;
      max-width: 120px;
    }

    .lb-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .lb-player-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lb-pct { color: #5ca8ff; font-weight: 600; }
    .lb-gold { color: #c8b040; }
    .lb-troops { color: #88dd88; font-weight: 600; }

    /* ════════════════════════════
       Bottom controls
    ════════════════════════════ */
    #conquest-controls {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: all;
    }

    #conquest-controls-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5070a0;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #troop-slider {
      width: 180px;
      accent-color: #33ee77;
      cursor: pointer;
    }

    #troop-pct-label {
      font-size: 18px;
      font-weight: 700;
      color: #33ee77;
      min-width: 48px;
      text-align: left;
    }

    /* ════════════════════════════
       Attack indicator — bottom left
    ════════════════════════════ */
    #attack-indicator {
      position: absolute;
      bottom: 22px;
      left: 14px;
      background: rgba(255, 80, 0, 0.12);
      border: 1px solid #ff6600;
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 12px;
      color: #ffaa33;
      font-weight: 600;
      display: none;
      animation: pulse-border 1.2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse-border {
      0%, 100% { border-color: #ff6600; box-shadow: 0 0 5px rgba(255, 102, 0, 0.4); }
      50%       { border-color: #ffaa44; box-shadow: 0 0 12px rgba(255, 153, 0, 0.6); }
    }

    /* ════════════════════════════
       Status messages
    ════════════════════════════ */
    #status-msg {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12.5px;
      color: #ff8855;
      background: rgba(5, 12, 28, 0.88);
      border: 1px solid rgba(255, 100, 40, 0.3);
      padding: 5px 14px;
      border-radius: 5px;
      display: none;
      pointer-events: none;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }

    /* ════════════════════════════
       Tile tooltip
    ════════════════════════════ */
    #tile-tooltip {
      position: absolute;
      background: rgba(5, 12, 28, 0.94);
      border: 1px solid rgba(40, 90, 200, 0.3);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 11px;
      color: #c8d8f0;
      pointer-events: none;
      display: none;
      line-height: 1.7;
      z-index: 50;
      backdrop-filter: blur(4px);
    }

    /* ════════════════════════════
       Right-click context menu
    ════════════════════════════ */
    #context-menu {
      position: fixed;
      background: rgba(5, 12, 28, 0.96);
      border: 1px solid rgba(40, 90, 200, 0.4);
      border-radius: 8px;
      padding: 8px 0;
      min-width: 160px;
      display: none;
      z-index: 200;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      pointer-events: all;
    }

    .cm-title {
      padding: 4px 14px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #5070a0;
      border-bottom: 1px solid rgba(40, 90, 200, 0.2);
      margin-bottom: 4px;
    }

    .cm-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 7px 14px;
      background: none;
      border: none;
      color: #c8d8f0;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      gap: 12px;
      transition: background 0.1s;
    }

    .cm-item:hover {
      background: rgba(68, 136, 255, 0.12);
    }

    .cm-cost {
      color: #c8b040;
      font-size: 11px;
      font-weight: 700;
    }

    .cm-disabled {
      padding: 6px 14px;
      font-size: 11px;
      color: #3a5278;
      cursor: default;
    }

    /* ════════════════════════════
       Alliance notification
    ════════════════════════════ */
    #alliance-notification {
      position: absolute;
      bottom: 140px;
      right: 14px;
      background: rgba(5, 12, 28, 0.95);
      border: 1px solid rgba(68, 204, 128, 0.5);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 12px;
      color: #c8d8f0;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 100;
      pointer-events: all;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 16px rgba(68, 204, 128, 0.2);
      min-width: 220px;
      animation: slide-in 0.25s ease;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .ally-btns {
      display: flex;
      gap: 8px;
    }

    .ally-btn {
      flex: 1;
      padding: 6px 0;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s;
    }

    .ally-btn:hover { filter: brightness(1.2); }

    .ally-accept {
      background: rgba(40, 168, 80, 0.3);
      border: 1px solid #28a850;
      color: #66ee88;
    }

    .ally-decline {
      background: rgba(200, 40, 40, 0.3);
      border: 1px solid #c83030;
      color: #ff7766;
    }

    /* ════════════════════════════
       Build panel — bottom left
    ════════════════════════════ */
    #build-panel {
      position: absolute;
      bottom: 88px;
      left: 14px;
      display: none;
      flex-direction: column;
      gap: 5px;
      pointer-events: all;
      z-index: 10;
    }

    #build-panel-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #3a5278;
      text-align: center;
    }

    .bld-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      background: rgba(5, 12, 28, 0.92);
      border: 1px solid rgba(40, 90, 200, 0.3);
      border-radius: 6px;
      color: #c8d8f0;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
      backdrop-filter: blur(8px);
      white-space: nowrap;
      min-width: 140px;
    }

    .bld-btn:hover:not(:disabled) {
      background: rgba(30, 60, 120, 0.5);
      border-color: rgba(68, 136, 255, 0.5);
      box-shadow: 0 0 8px rgba(68, 136, 255, 0.2);
    }

    .bld-btn.active {
      border-color: #44bbff;
      background: rgba(0, 80, 160, 0.35);
      box-shadow: 0 0 12px rgba(68, 187, 255, 0.35);
    }

    .bld-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .bld-btn-icon { font-size: 14px; }
    .bld-btn-name { flex: 1; font-weight: 600; }
    .bld-btn-cost { font-size: 10px; color: #c8b040; font-weight: 700; }

    #nuke-btn {
      margin-top: 3px;
      background: rgba(120, 10, 10, 0.5);
      border-color: rgba(255, 60, 60, 0.4);
      color: #ff8888;
    }

    #nuke-btn:hover:not(:disabled) {
      background: rgba(180, 20, 20, 0.6);
      border-color: #ff4444;
      box-shadow: 0 0 12px rgba(255, 60, 60, 0.4);
    }

    #nuke-btn.active {
      border-color: #ff3333;
      background: rgba(200, 0, 0, 0.4);
      box-shadow: 0 0 16px rgba(255, 50, 50, 0.5);
      animation: nuke-pulse 0.8s ease-in-out infinite;
    }

    @keyframes nuke-pulse {
      0%, 100% { box-shadow: 0 0 10px rgba(255, 50, 50, 0.4); }
      50% { box-shadow: 0 0 20px rgba(255, 80, 0, 0.7); }
    }

    /* ════════════════════════════
       Mode hint bar
    ════════════════════════════ */
    #mode-hint {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(5, 12, 28, 0.92);
      border: 1px solid rgba(68, 136, 255, 0.4);
      border-radius: 6px;
      padding: 6px 18px;
      font-size: 12px;
      color: #88ccff;
      font-weight: 600;
      display: none;
      pointer-events: none;
      letter-spacing: 0.04em;
      white-space: nowrap;
      backdrop-filter: blur(8px);
      animation: hint-glow 1.5s ease-in-out infinite;
    }

    @keyframes hint-glow {
      0%, 100% { border-color: rgba(68, 136, 255, 0.4); }
      50% { border-color: rgba(68, 136, 255, 0.9); box-shadow: 0 0 10px rgba(68, 136, 255, 0.3); }
    }

    #mode-hint.nuke-mode {
      border-color: rgba(255, 60, 60, 0.5);
      color: #ff9988;
      animation: nuke-hint-glow 0.8s ease-in-out infinite;
    }

    @keyframes nuke-hint-glow {
      0%, 100% { border-color: rgba(255, 60, 60, 0.4); box-shadow: none; }
      50% { border-color: #ff4444; box-shadow: 0 0 12px rgba(255, 60, 0, 0.4); }
    }

    /* ════════════════════════════
       Building legend — bottom right (above minimap)
    ════════════════════════════ */
    #building-legend {
      position: absolute;
      bottom: 200px;
      right: 14px;
      background: rgba(5, 12, 28, 0.75);
      border: 1px solid rgba(40, 90, 200, 0.2);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 10px;
      color: #5070a0;
      pointer-events: none;
      line-height: 1.8;
    }

    .bld-row { display: flex; align-items: center; gap: 6px; }
    .bld-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ════════════════════════════
       Connecting overlay
    ════════════════════════════ */
    #connecting-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 15, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;
      z-index: 100;
      pointer-events: all;
    }

    .logo-text {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4488ff;
      text-shadow: 0 0 24px rgba(68, 136, 255, 0.5);
    }

    .connect-sub {
      font-size: 13px;
      color: #5070a0;
      letter-spacing: 0.04em;
    }

    .name-input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #player-name-input {
      background: rgba(10, 20, 45, 0.9);
      border: 1px solid rgba(68, 136, 255, 0.4);
      border-radius: 6px;
      color: #c8d8f0;
      font-size: 14px;
      font-family: inherit;
      padding: 9px 14px;
      width: 210px;
      outline: none;
      transition: border-color 0.2s;
    }

    #player-name-input:focus {
      border-color: rgba(68, 136, 255, 0.8);
      box-shadow: 0 0 8px rgba(68, 136, 255, 0.25);
    }

    #join-btn {
      padding: 9px 22px;
      background: #2255bb;
      color: #e8f0ff;
      border: 1px solid rgba(68, 136, 255, 0.5);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.04em;
      transition: background 0.2s, box-shadow 0.2s;
    }

    #join-btn:hover {
      background: #3366cc;
      box-shadow: 0 0 12px rgba(68, 136, 255, 0.4);
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(40, 90, 200, 0.2);
      border-top-color: #4488ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ════════════════════════════
       Game over overlay
    ════════════════════════════ */
    #gameover-overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 15, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 100;
      pointer-events: all;
    }

    #gameover-title {
      font-size: 36px;
      font-weight: 900;
      color: #ffaa33;
      letter-spacing: 0.08em;
      text-shadow: 0 0 20px rgba(255, 170, 51, 0.5);
    }

    #gameover-msg {
      font-size: 15px;
      color: #c8d8f0;
    }

    #gameover-overlay button {
      margin-top: 8px;
      padding: 11px 32px;
      background: #2255bb;
      color: #e8f0ff;
      border: 1px solid rgba(68, 136, 255, 0.5);
      border-radius: 7px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.04em;
      pointer-events: all;
      transition: background 0.2s, box-shadow 0.2s;
    }

    #gameover-overlay button:hover {
      background: #3366cc;
      box-shadow: 0 0 12px rgba(68, 136, 255, 0.4);
    }
  </style>
</head>
<body>
  <!-- Canvas layer (PixiJS appends canvas here) -->
  <div id="game-canvas"></div>

  <!-- Subtle vignette -->
  <div id="vignette"></div>

  <!-- UI layer -->
  <div id="ui-overlay">

    <!-- Player HUD — top left -->
    <div id="player-hud" class="panel">
      <div id="player-name">—</div>
      <div class="stat-row">
        <span class="stat-label"><span class="icon">⚔</span> Asker</span>
        <span class="stat-value" id="stat-troops">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label"><span class="icon">⚒</span> İşçi</span>
        <span class="stat-value" id="stat-workers">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label"><span class="icon">👥</span> Nüfus</span>
        <span class="stat-value" id="stat-pop">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label"><span class="icon">💰</span> Altın</span>
        <span class="stat-value" id="stat-gold">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label"><span class="icon">🗺</span> Toprak</span>
        <span class="stat-value" id="stat-tiles">0 tile</span>
      </div>
    </div>

    <!-- Leaderboard — top right -->
    <div id="leaderboard" class="panel">
      <div class="lb-header">
        <h3>Sıralama</h3>
        <span id="game-timer">00:00</span>
      </div>
      <table class="lb-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Oyuncu</th>
            <th>Alan%</th>
            <th>Altın</th>
            <th>Birlik</th>
          </tr>
        </thead>
        <tbody id="lb-list"></tbody>
      </table>
    </div>

    <!-- Building legend -->
    <div id="building-legend">
      <div class="bld-row"><div class="bld-dot" style="background:#ffcc00"></div> Şehir (500g)</div>
      <div class="bld-row"><div class="bld-dot" style="background:#00aaff"></div> Liman (300g)</div>
      <div class="bld-row"><div class="bld-dot" style="background:#dd6600"></div> Fabrika (800g)</div>
      <div class="bld-row"><div class="bld-dot" style="background:#ff3333"></div> SAM (800g)</div>
      <div class="bld-row"><div class="bld-dot" style="background:#aaaaaa"></div> Silo (1200g)</div>
    </div>

    <!-- Mode hint bar -->
    <div id="mode-hint"></div>

    <!-- Build panel — bottom left -->
    <div id="build-panel">
      <div id="build-panel-label">YAPI KUR</div>
      <button class="bld-btn" id="btn-city"    data-type="city">
        <span class="bld-btn-icon">🏙</span>
        <span class="bld-btn-name">Şehir</span>
        <span class="bld-btn-cost">500g</span>
      </button>
      <button class="bld-btn" id="btn-factory" data-type="factory">
        <span class="bld-btn-icon">🏭</span>
        <span class="bld-btn-name">Fabrika</span>
        <span class="bld-btn-cost">800g</span>
      </button>
      <button class="bld-btn" id="btn-sam"     data-type="sam">
        <span class="bld-btn-icon">🚀</span>
        <span class="bld-btn-name">Hava Savunma</span>
        <span class="bld-btn-cost">800g</span>
      </button>
      <button class="bld-btn" id="btn-silo"    data-type="silo">
        <span class="bld-btn-icon">💣</span>
        <span class="bld-btn-name">Nükleer Silo</span>
        <span class="bld-btn-cost">1200g</span>
      </button>
      <button class="bld-btn" id="nuke-btn">
        <span class="bld-btn-icon">☢</span>
        <span class="bld-btn-name">Nükleer Fırlat</span>
      </button>
    </div>

    <!-- Conquest controls — bottom center -->
    <div id="conquest-controls" class="panel">
      <div id="conquest-controls-label">⚔ Saldırı Gücü</div>
      <div class="slider-row">
        <input type="range" id="troop-slider" min="10" max="100" step="5" value="50" />
        <span id="troop-pct-label">50%</span>
      </div>
    </div>

    <!-- Attack indicator — bottom left -->
    <div id="attack-indicator"></div>

    <!-- Status message -->
    <div id="status-msg"></div>

    <!-- Tile tooltip -->
    <div id="tile-tooltip"></div>

    <!-- Alliance incoming notification -->
    <div id="alliance-notification"></div>

    <!-- Connecting overlay -->
    <div id="connecting-overlay">
      <div class="logo-text">OPENFRONT</div>
      <p class="connect-sub">Toprak fethine hazır mısın?</p>
      <div class="name-input-row">
        <input type="text" id="player-name-input" placeholder="Oyuncu adın..." maxlength="20" autocomplete="off" />
        <button id="join-btn">Katıl</button>
      </div>
      <div class="spinner" id="connect-spinner"></div>
      <p class="connect-sub" id="connect-status" style="display:none">Sunucuya bağlanılıyor...</p>
    </div>

    <!-- Game over overlay -->
    <div id="gameover-overlay">
      <h2 id="gameover-title">Game Over</h2>
      <p id="gameover-msg"></p>
      <button onclick="location.reload()">Tekrar Oyna</button>
    </div>

  </div>

  <!-- Context menu (outside ui-overlay so it's not pointer-events: none) -->
  <div id="context-menu"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
